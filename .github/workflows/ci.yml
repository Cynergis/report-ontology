name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # The OTO port (tests/test_oto_port.py) needs the engine: the branch that holds the questions and shapes.
      - run: pip install "oto-kg[rdf] @ git+https://github.com/Cynergis/oto.git@semantic-layer"
      # Flow checks are skipped here: the flow instance lives with its owner (set FLOW_ROOT to run them).
      - run: pytest -q
