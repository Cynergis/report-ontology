<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview</title>
<link rel="stylesheet" href="../_studio/studio.css">
<style>
.front-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.front-grid .studio-card { margin: 0; }
a.front-page { display: block; color: inherit; text-decoration: none; }
a.front-page:hover .studio-card, a.front-page:focus-visible .studio-card { border-color: var(--st-accent); }
a.front-page strong { color: var(--st-accent); }
.front-tag { display: inline-block; font-size: 13px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--st-line); color: var(--st-muted); }
.front-open li { margin: 4px 0; }
</style>
<script src="../_studio/data.js"></script>
<script src="../_studio/studio.js"></script>
<script src="data.js"></script>
</head>
<body>
<main class="studio-page">
  <h1 id="title">The product</h1>
  <p class="studio-lead" id="lead"></p>
  <div id="front"></div>
</main>
<script src="app.js"></script>
</body>
</html>
